[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "explab"
version = "1.0.0"
description = "Pre-registered experimentation study on the Upworthy Research Archive: question headlines, CTR, and observational recovery of a randomized benchmark."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "numpy==2.2.6",
    "scipy==1.15.3",
    "pandas==2.3.3",
    "matplotlib==3.11.2",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
