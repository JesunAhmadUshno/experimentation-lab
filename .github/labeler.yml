src:
  - changed-files:
      - any-glob-to-any-file: ["src/**"]
data:
  - changed-files:
      - any-glob-to-any-file: ["data/**", "prereg/**", "reports/**", "results/**"]
tests:
  - changed-files:
      - any-glob-to-any-file: ["tests/**"]
docs:
  - changed-files:
      - any-glob-to-any-file: ["docs/**", "README.md", "CHANGELOG.md"]
site:
  - changed-files:
      - any-glob-to-any-file: ["site/**"]
automation:
  - changed-files:
      - any-glob-to-any-file: [".github/**"]
